<!doctype html>
<html lang="en" data-theme="signal" data-mode="dark">
<head>
<script>
  try {
    var t = localStorage.getItem('shardlure_theme') || 'signal';
    var m = localStorage.getItem('shardlure_mode') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    if (t === 'signal') document.documentElement.setAttribute('data-mode', m);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'signal');
    document.documentElement.setAttribute('data-mode', 'dark');
  }
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ShardLure Live</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0608;
    --glass: #141010;
    --glass-2: #1e1618;
    --line: rgba(200,120,100,0.10);
    --line-strong: rgba(200,120,100,0.22);
    --text: #e8dcd8;
    --dim: #907068;
    --accent: #d02828;
    --accent-2: #c89828;
    --good: #48b878;
    --warn: #c89828;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sans: "Chakra Petch", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font: 13px/1.5 var(--sans);
    background: var(--bg);
    color: var(--text);
  }

  #vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 90%),
      linear-gradient(90deg, rgba(0,0,0,0.55) 0%, transparent 22%, transparent 78%, rgba(0,0,0,0.55) 100%);
  }

  .rail {
    position: fixed; top: 0; bottom: 0; z-index: 2;
    width: 320px; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
    height: 100vh; overflow-y: auto; overflow-x: hidden;
    pointer-events: none;
  }
  /* Left rail is a touch wider than the right: it carries the numeric readouts
     (summary grid, gauge breakdown, honeypot status) which need the horizontal
     room, while the right rail holds a narrow feed. */
  .rail.left  { left: 0; width: 344px; }
  /* Let the trailing panel absorb any leftover rail height, but never force it:
     `flex: 1 1 auto` with min-height:auto grows into free space while still
     shrinking to its content when the rail is full (with the Honeypot panel
     added there is little slack, and a forced stretch clipped the gauge
     breakdown off the bottom). */
  .rail.left > .panel:last-child { flex: 1 1 auto; min-height: -moz-fit-content; min-height: fit-content; }
  .rail.right { right: 0; }
  .rail > * { pointer-events: auto; }

  .panel {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    box-shadow: none;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--dim);
  }

  .title h1 {
    margin: 0 0 6px;
    font-size: 17px; font-weight: 600; letter-spacing: -0.005em;
  }
  .title .dot {
    display: inline-block; width: 8px; height: 8px;
    background: var(--accent); border-radius: 50%; margin-right: 9px;
    vertical-align: 2px;
    box-shadow: 0 0 0 0 var(--accent), 0 0 10px var(--accent);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent), 0 0 10px color-mix(in srgb, var(--accent) 80%, transparent); }
    100% { box-shadow: 0 0 0 14px transparent, 0 0 10px color-mix(in srgb, var(--accent) 80%, transparent); }
  }
  .title .meta {
    color: var(--dim); font-family: var(--mono); font-size: 11px;
    line-height: 1.6;
  }
  .title .meta strong { color: var(--text); font-weight: 500; }
  .nav { display: flex; gap: 8px; margin-top: 12px; }
  .nav a {
    font-size: 11px; font-family: var(--mono); text-decoration: none;
    padding: 5px 10px; border-radius: 3px; border: 1px solid var(--line);
    color: var(--dim);
  }
  .nav a:hover { color: var(--text); border-color: var(--line-strong); }
  .nav a.active { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--glass-2); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
  .stat .num {
    font-family: var(--mono); font-size: 22px; font-weight: 600;
    line-height: 1.1; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat .num.accent { color: var(--accent); }
  .stat .num.blue { color: var(--accent-2); }
  .stat .num.good { color: var(--good); }
  .stat .num.warn { color: var(--warn); }
  .stat .label { color: var(--dim); font-size: 10px; margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }

  /* The Threat panel is the left rail's trailing panel, so it absorbs the rail's
     slack (see .rail.left > .panel:last-child). Make its content stretch with it
     instead of bunching at the top: the panel becomes a flex column, the gauge
     fills the free height, and the arc + breakdown space out evenly. */
  .rail.left > .panel:last-child { display: flex; flex-direction: column; }
  .rail.left > .panel:last-child > .gauge-outer { flex: 1 1 auto; justify-content: space-evenly; }
  .hp-grid { display: grid; gap: 6px; font-family: var(--mono); font-size: 11.5px; }
  .hp-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .hp-k { color: var(--dim); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  .hp-v { color: var(--text); font-variant-numeric: tabular-nums; text-align: right; }
  .hp-v.up { color: var(--good); }
  .hp-v.down { color: var(--danger, var(--accent)); }
  .hp-v.stale { color: var(--warn); }
  .gauge-outer { display: flex; flex-direction: column; align-items: center; padding: 0; }
  /* Sized so the four left-rail panels fit a 900px viewport without scrolling.
     Was 260px when the rail had slack; the Honeypot panel took that room. */
  .gauge-svg { width: 100%; max-width: 210px; height: auto; }
  .gauge-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font: 10px var(--mono); color: var(--dim); margin-top: 8px; width: 100%; }
  .gauge-breakdown .gb-row { display: flex; justify-content: space-between; }
  .gauge-breakdown .gb-val { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; table-layout: fixed; }
  th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th { color: var(--dim); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 7px; }
  td.n, th.n { text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; }
  td .ip { color: var(--accent-2); }
  #top-ips th:nth-child(1), #top-ips td:nth-child(1) { width: 44%; }
  #top-ips th:nth-child(2), #top-ips td:nth-child(2) { width: 36%; }
  #top-ips th:nth-child(3), #top-ips td:nth-child(3) { width: 20%; }

  .feed {
    flex: 1; overflow: hidden; position: relative;
    font-family: var(--mono); font-size: 11px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
  }
  .feed-inner { position: absolute; inset: 0; overflow-y: auto; padding-right: 6px; }
  .feed-inner::-webkit-scrollbar { width: 4px; }
  .feed-inner::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }
  .feed-row {
    padding: 6px 0; border-bottom: 1px dotted var(--line);
    display: grid; grid-template-columns: 52px minmax(0,1fr);
    gap: 6px 10px; align-items: start;
    animation: fadein 0.4s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: none; } }
  .feed-row .t { color: var(--dim); grid-row: 1 / span 2; }
  .feed-row .body { min-width: 0; }
  .feed-row .ip { color: var(--accent-2); margin-right: 6px; }
  .feed-row .u { color: var(--warn); margin-right: 6px; }
  .feed-row .k { color: var(--text); }
  .feed-row .cmd { color: var(--good); display: block; margin-top: 3px; word-break: break-all; line-height: 1.35; }
  .feed-row .meta { color: var(--dim); font-size: 10px; margin-top: 2px; }
  .sparkline {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 2;
    width: clamp(360px, calc(100vw - 700px), 560px);
    background: var(--glass); border: 1px solid var(--line);
    border-radius: 4px; padding: 12px 16px 10px;
    box-shadow: none;
  }
  .sparkline .label {
    color: var(--dim); font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em;
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 0 0 6px;
  }
  .sparkline canvas {
    display: block;
    width: 100%;
    height: 40px;
  }

  @media (max-width: 1100px) {
    .rail { width: 280px; padding: 14px; }
    .sparkline { display: none; }
  }
  @media (max-width: 760px) {
    .rail.left { width: 100%; height: auto; bottom: auto; padding: 10px; }
    .rail.right { display: none; }
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
  ::-webkit-scrollbar-track { background: transparent; }

  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 52px; z-index: 5;
    background: var(--glass); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 0; gap: 6px;
  }
  .sb-brand {
    width: 32px; height: 32px; border-radius: 4px; background: var(--accent);
    display: grid; place-items: center;
    font: 700 14px var(--sans); color: #1a0808; margin-bottom: 8px;
  }
  /* The mark is inlined (not an <img>) so it inherits currentColor and tracks
     the theme. It sits ON the accent chip, so it paints in the chip's ink
     colour rather than the accent itself. */
  .sb-brand .sb-logo { width: 20px; height: 20px; display: block; color: #1a0808; }
  .sb-item {
    width: 34px; height: 34px; border-radius: 4px;
    display: grid; place-items: center; color: var(--dim);
    cursor: pointer; border: 1px solid transparent; position: relative;
    text-decoration: none;
  }
  .sb-item:hover { color: var(--text); background: var(--glass-2); border-color: var(--line); }
  .sb-item.on {
    color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-color: color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .sb-item.on::before {
    content: ''; position: absolute; left: -1px; top: 8px; bottom: 8px;
    width: 2px; background: var(--accent); border-radius: 0 2px 2px 0;
  }
  .sb-item svg {
    width: 16px; height: 16px; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .sb-spacer { flex: 1; }
  .sb-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent); margin-bottom: 8px;
    animation: sbPulse 1.8s infinite;
  }
  @keyframes sbPulse {
    0%,100% { box-shadow: 0 0 4px var(--accent); }
    50% { box-shadow: 0 0 14px var(--accent), 0 0 24px color-mix(in srgb, var(--accent) 15%, transparent); }
  }
  /* Accent dot halos, Signal only. The shared 10-24px acid-lime bloom is mild on
     the pale themes but glares on a near-black ground, so Signal gets a tighter
     one rather than every theme losing the effect. */
  html[data-theme="signal"] .title .dot {
    box-shadow: 0 0 0 0 var(--accent), 0 0 5px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  html[data-theme="signal"] .sb-dot {
    box-shadow: 0 0 4px color-mix(in srgb, var(--accent) 60%, transparent);
    animation: none;
  }
  html[data-theme="signal"] .title .dot { animation: pulseSignal 1.8s infinite; }
  @keyframes pulseSignal {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent), 0 0 5px color-mix(in srgb, var(--accent) 55%, transparent); }
    100% { box-shadow: 0 0 0 10px transparent, 0 0 5px color-mix(in srgb, var(--accent) 55%, transparent); }
  }
  .rail.left { left: 52px; }
  @media (max-width: 760px) {
    .sidebar { display: none; }
    .rail.left { left: 0; }
  }

/* Reduced motion: disable CSS transitions and animations when the user
   prefers reduced motion. The JS-side globe animation is also paused
   in cobe-boot.js when this media query matches. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

</style>

<div id="cobe-stage" hidden>
  <!-- White dilate-outline for globe stickers: emoji get a die-cut edge so they

<script>
// Forward the dashboard auth token (?token=… in the page URL) on every /api/
// fetch when SHARDLURE_DASH_TOKEN is set server-side. Without this the globe
// loads but /api/dashboard and /api/capture 401. No token => no-op.

/* ==== UI theme (Signal / Meridian / Sprite) ==== */
window.__shardlureTheme = 'signal';
function currentThemeId() {
  return window.__shardlureTheme || document.documentElement.getAttribute('data-theme') || 'signal';
}
function applyMode(mode) {
  mode = (mode === 'light') ? 'light' : 'dark';
  try { localStorage.setItem('shardlure_mode', mode); } catch (e) {}
  if (currentThemeId() === 'signal') {
    document.documentElement.setAttribute('data-mode', mode);
  } else {
    document.documentElement.removeAttribute('data-mode');
  }
  try { syncGlobeEngine(currentThemeId()); } catch (e) {}
}
function applyTheme(id, opts) {
  if (id !== 'signal' && id !== 'meridian' && id !== 'sprite') id = 'signal';
  var force = opts && opts.force;
  var prev = window.__shardlureTheme;
  // Same-tab BroadcastChannel echoes postMessage back to our own listener.
  // Bail before re-broadcast / onTheme when nothing changed — otherwise the
  // pivot graph destroy/create loops forever and never paints.
  if (!force && prev === id && document.documentElement.getAttribute('data-theme') === id) {
    return id;
  }
  window.__shardlureTheme = id;
  document.documentElement.setAttribute('data-theme', id);
  if (id === 'signal') {
    document.documentElement.setAttribute('data-mode', localStorage.getItem('shardlure_mode') || 'dark');
  } else {
    document.documentElement.removeAttribute('data-mode');
  }
  try { localStorage.setItem('shardlure_theme', id); } catch (e) {}
  try {
    if (typeof BroadcastChannel !== 'undefined') {
      window.__shardlureThemeEcho = id;
      var bc = new BroadcastChannel('shardlure-theme');
      bc.postMessage({ theme: id, mode: localStorage.getItem('shardlure_mode') || 'dark' });
      bc.close();
    }
  } catch (e) {}
  if (typeof window.__shardlureOnTheme === 'function') {
    try { window.__shardlureOnTheme(id); } catch (e) {}
  }
  return id;
}
async function syncThemeFromServer() {
  try {
    var r = await fetch('/api/settings?_=' + Date.now(), { cache: 'no-store' });

function drawSpark(series) {
  const ctx = spark.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = spark.clientWidth;
  const h = spark.clientHeight;
  if (!w || !h) return;
  spark.width = w * dpr;
  spark.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!series.length) return;
  const minT = series[0].t;
  const maxT = series[series.length - 1].t;
  const maxV = Math.max.apply(null, series.map(function(p){ return p.n || 0; }));
  document.getElementById('spark-max').textContent = 'peak ' + fmt(maxV) + '/h';

  const ac = themeAccentRGB();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, rgba(ac, 0.55));
  grad.addColorStop(1, rgba(ac, 0.02));
  const pad = 1;
  const xy = function(p) {
    return [
      ((p.t - minT) / (maxT - minT || 1)) * (w - pad * 2) + pad,
      h - pad - ((p.n || 0) / (maxV || 1)) * (h - pad * 2)
    ];
  };

  ctx.beginPath();
  series.forEach(function(p, i){ const q = xy(p); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
  ctx.lineTo(w - pad, h); ctx.lineTo(pad, h); ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  series.forEach(function(p, i){ const q = xy(p); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
  ctx.strokeStyle = ac.hex;
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

function greatCircleDeg(p, q) {

/**
 * Choose overlays that will actually be legible, in volume order.
 *
 * Real attacker geography is heavily clustered: the busiest actors are
 * routinely several machines in ONE datacentre city, so a plain volume slice
 * stacks overlays on top of each other. Two Amsterdam actors were observed
 * projecting to byte-identical screen coordinates, which reads as overlays
 * simply not existing. Every theme therefore picks by separation, not rank.
 *
 * Returns {a, i} where `i` is the index in the ORIGINAL pool, because marker
 * ids are built from that ordering and anchoring to `a<i>` of a re-indexed list
 * puts an overlay on the wrong actor.
 *
 *   minSepDeg  great-circle degrees required between any two picks
 *   max        hard cap; past a handful they stop being readable
 *   seeds      points already occupied that picks must also clear (e.g. home)
 *   keyOf      optional label key per candidate (Sprite: country). A candidate
 *              whose key is taken, or which has none, is skipped.
 *   seedKeys   keys pre-marked as taken (Sprite: the operator's own country)

    var a = pool[i], key = keyOf ? keyOf(a) : null;
    if (keyOf && (!key || taken[key])) continue;
    var clash = false;
    for (var si = 0; si < seeds.length && !clash; si++) {

    }
    for (var pi = 0; pi < picked.length && !clash; pi++) {
      if (greatCircleDeg(picked[pi].a, a) < minSep) clash = true;
    }
    if (clash) continue;
    if (keyOf) taken[key] = true;
    picked.push({ a: a, i: i, key: key });

/**

function buildSatChipOverlays(home, pool) {
  var out = [];
  out.push({
    lat: home.lat, lng: home.lon, kind: 'live', alt: 0.05,

    lat: home.lat, lng: home.lon, kind: 'sat', alt: 0.075,
    label: 'HUB', placeKey: 'home', hub: true, ringDelay: 0,

  // and the declutter pass resolves the overlap at render time in the home
  // badge's favour; dropping the pick outright would lose an attacker in the

  pickSpreadOverlays(pool, { minSepDeg: 25, max: 6 }).forEach(function (p, i) {

  // yields one overlay. It must never be pre-sliced: the selectors below filter
  // by country and separation, and filtering a 6-item slice left two survivors.
  // Falls back to raw volume order only before Cobe has data, which the 25 deg
  // separation rule still de-clusters adequately.
  var satChipPool = (window.ShardCobe && window.ShardCobe.actorOrder)
    ? (window.ShardCobe.actorOrder() || geoActors)
    : geoActors;

  if (theme === 'signal' || theme === 'meridian') {
    return buildSatChipOverlays(home, satChipPool);

    out.push({
      lat: home.lat, lng: home.lon, kind: 'sticker', alt: 0.04,

      placeKey: 'home', marker: 'home', tilt: -4

    // geo-deduped set, so raw index i and marker `a<i>` are different actors
    // whenever two actors share a bucket (Amsterdam/Frankfurt collapse often).
    // Anchoring to the wrong marker is exactly how a flag ends up on the wrong
    // city, so the index has to come from the same source the markers did.
    // The ordering MUST come from Cobe, because that is what the marker ids were
    // built from. Deriving it locally from this function's own actor list looks
    // equivalent but is not: the dashboard hands Cobe a merged actors+topActors
    // list, so an independently-computed order puts flag i over marker i of a
    // different actor. If Cobe has no data yet, emit no stickers at all — a
    // missing flag is recoverable on the next poll, a flag on the wrong country
    // is a lie.
    var ordered = (window.ShardCobe && window.ShardCobe.actorOrder)
      ? window.ShardCobe.actorOrder()
      : null;
    if (!ordered) return out;

    // RENDER time by the declutter pass, which hides whichever of a colliding
    // pair is lower priority for as long as they collide. The globe can
    // therefore represent the whole attacker spread and reveal different
    // countries as it rotates, instead of freezing on four of them.
    //
    // One flag per COUNTRY, since that is what a flag answers, and a small
    // separation to catch near-identical points that would sit under the same
    // flag at any rotation (Amsterdam / Frankfurt / London at this globe size).
    // It stays small because anything rotation-dependent is declutter's job.
    // HOME is a seed so the rules apply against it too - otherwise an attacker
    // in the operator's own country renders a second identical flag right next
    // to the home one (observed: two India flags 13px apart).
    var picked = pickSpreadOverlays(ordered, {
      minSepDeg: 6,
      max: 18,
      seeds: [{ lat: home.lat, lon: home.lon }],
      keyOf: function (a) { var cc = a.cc || ''; return cc === '??' ? '' : cc; },
      seedKeys: [home && home.cc],

        lat: p.a.lat, lng: p.a.lon, kind: 'sticker', alt: 0.03,
        emoji: flag(p.key),
        label: p.key + ' · ' + (p.a.city || p.a.ip || ''),
        // marker index must be the one from the MARKER ordering, not this
        // sticker's own index, or the flag anchors to a different actor.
        placeKey: 'a' + p.i, marker: 'a' + p.i,

    live.innerHTML = '<i></i>LIVE <b>' + esc(d.sub || '') + '</b>';
    wrap.appendChild(live);
  } else if (d.kind === 'analytics') {
    var chip = document.createElement('div');
    chip.className = 'globe-analytics';
    chip.innerHTML = '<span class="lbl">' + esc(d.title || '') + '</span>' +
      esc(d.value || '') + ' <span class="' + (d.trend === 'dn' ? 'dn' : 'up') + '">' +
      esc(d.trendLabel || '') + '</span>';
    wrap.appendChild(chip);
  }
  return wrap;
}

var _overlayKey = '';

/** Signature of the rendered overlay set, so an unchanged poll is a no-op. */
function overlaySignature(theme, data) {
  return theme + '#' + data.map(function (d) {
    return [d.kind, d.marker || '', d.placeKey || '', d.emoji || d.sticker || '',
      d.title || '', d.value || '', d.sub || '',
      Number(d.lat).toFixed(2), Number(d.lng).toFixed(2)].join(',');
  }).join('|');
}

function applyGlobeOverlays(force) {
  var theme = currentThemeId();
  var data = buildThemeOverlays(theme, _lastHome, _lastActors);
  if (!window.ShardCobe || !window.ShardCobe.isActive()) return;
  // setOverlayPlaces tears down and recreates every overlay element. The
  // dashboard polls every 5s, so doing that unconditionally destroyed and
  // rebuilt each sticker on every poll - which reset its declutter state and
  // showed up as flags blinking roughly every 5 seconds (measured 4.1
  // visibility flips/sec). Skip when the rendered set is byte-identical.
  var key = overlaySignature(theme, data);
  if (!force && key === _overlayKey) return;
  _overlayKey = key;
  var places = [];
  var nodes = [];
  var seenPlaces = {};
  data.forEach(function (d, i) {
    var id = d.placeKey || ('ov' + i);
    if (!seenPlaces[id]) {
      places.push({ id: id, lat: d.lat, lon: d.lng, label: d.label || d.title || '' });
      seenPlaces[id] = true;
    }
    var el = makeOverlayEl(d);
    el.setAttribute('data-place', id);
    // data-marker opts this element into CSS anchor positioning against the
    // matching Cobe marker (`--cobe-<id>`), which is pixel-exact because the
    // library places the anchor with the same projection it draws with. Only
    // set it when the id really is a marker id (home / a<i>).
    if (d.marker) el.setAttribute('data-marker', d.marker);
    // Declutter group is the VISUAL CLASS, not the kind. Text competes with
    // text: an analytics chip and the LIVE badge are both reading matter and
    // must not overlap, while a satellite mark and its own chip deliberately
    // share a place (mark on the point, chip beside it) and have to coexist.
    el.setAttribute('data-dc-group', DECLUTTER_GROUP[d.kind] || 'label');
    if (d.tilt != null) el.style.setProperty('--tilt', d.tilt + 'deg');
    if (d.kind === 'sticker' || d.kind === 'sat') el.setAttribute('data-offset', 'float');
    else if (d.kind === 'live' || d.kind === 'analytics') el.setAttribute('data-offset', 'side');
    nodes.push(el);
  });
  if (!seenPlaces.home) {
    places.push({ id: 'home', lat: _lastHome.lat, lon: _lastHome.lon, label: 'Home' });
  }
  window.ShardCobe.setOverlayPlaces(places, nodes);
}

async function refresh() {
  const r = await fetch('/api/dashboard?_=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) return;
  const d = await r.json();
  const summary = d.summary || {};
  const actors = d.actors || [];
  const recent = d.recent || [];
  const home = d.home || { lat: 19.076, lon: 72.8777, city: 'Mumbai', country: 'India', cc: 'IN' };
  _lastHome = home;
  _lastActors = actors;
  _lastTopActors = d.topActors || [];
  // Cobe is fed a merged actors+topActors list (see the updateData call below).
  // Remember exactly that list so the theme-switch path re-sends the SAME one:
  // sending the unmerged list there rebuilt markers from a different set, so the
  // marker ids meant different actors depending on which path ran last.
  _lastGlobeActors = mergeActorsForGlobe(actors, _lastTopActors);

  document.getElementById('s-events').textContent = fmt(summary.eventCount);
  document.getElementById('s-actors').textContent = fmt(summary.actorCount);
  document.getElementById('s-ips').textContent = fmt(summary.uniqueIps);
  document.getElementById('s-countries').textContent = fmt(summary.countries);
  // Identity-over-IP coverage is EVENT-weighted over cowrie telemetry (see
  // store.HASSHCoverage). Dividing by actorCount inverted the meaning: clustering
  // collapses many IPs into one actor row, so the better it worked the worse the
  // ratio looked (live box read 3% while 93.5% of events carried a fingerprint).
  var fpN = summary.fingerprinted || 0, fpT = summary.fingerprintTotal || 0;
  document.getElementById('s-fingerprinted').textContent =
    fpT > 0 ? (Math.round(fpN / fpT * 1000) / 10) + '%' : '—';
  // All-time distinct cowrie sessions. Uses summary.sessionCount, NOT
  // d.sessions.length — that slice is server-capped at 30, so the tile would
  // read a permanent "30" on any busy honeypot.
  document.getElementById('s-sessions').textContent = fmt(summary.sessionCount || 0);

  // Honeypot panel. Cowrie runs as a SEPARATE systemd unit from this daemon, so
  // its uptime is read read-only from systemd (cowrieUptimeSeconds); -1 means
  // "could not determine" (no systemd, or unit never started) and renders as a
  // dash rather than a fake zero. "last event" is the independent liveness
  // signal that matters: a Cowrie that is 'up' but not logging is the real
  // failure mode, and it comes from the newest ingested event, not the process.
  var up = Number(summary.cowrieUptimeSeconds);
  var stEl = document.getElementById('hp-state');
  var upEl = document.getElementById('hp-uptime');
  if (Number.isFinite(up) && up >= 0) {
    stEl.textContent = 'active';
    stEl.className = 'hp-v up';
    upEl.textContent = dur(up);
  } else {
    stEl.textContent = 'unknown';
    stEl.className = 'hp-v';
    upEl.textContent = '—';
  }
  var newest = (d.recent && d.recent.length) ? d.recent[0] : null;
  var lastEl = document.getElementById('hp-last');
  if (newest && newest.ts) {
    var age = Math.max(0, Math.round((Date.now() - new Date(newest.ts).getTime()) / 1000));
    lastEl.textContent = dur(age) + ' ago';
    // Cowrie sees traffic constantly; minutes of silence is worth flagging.
    lastEl.className = 'hp-v ' + (age > 900 ? 'stale' : 'up');
  } else {
    lastEl.textContent = '—';
    lastEl.className = 'hp-v';
  }
  document.getElementById('hp-ingest').textContent = fmt(summary.eventCount || 0) + ' ev';
  document.getElementById('home-loc').textContent = flag(home.cc) + ' ' + [home.city, home.country].filter(Boolean).join(', ');
  document.getElementById('gen-at').textContent = new Date(d.generatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  renderGauge(d.threat);

  renderTopIPs(d.topIps);
  renderFeed(recent);

  sparkData = (d.hourly || []).slice(-72);
  drawSpark(sparkData);

  const points = actors.filter(function(a) { return Number.isFinite(a.lat) && Number.isFinite(a.lon); });
  if (!points.length && actors.length) {
    document.getElementById('s-countries').textContent = '…';
  }

  if (window.ShardCobe) {
    window.ShardCobe.updateData(home, _lastGlobeActors);
  }
  applyGlobeOverlays();
}

refresh();
setInterval(refresh, 5000);
window.addEventListener('resize', function() { drawSpark(sparkData); });
</script>

</body>
</html>
