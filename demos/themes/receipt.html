<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Receipt · ShardLure theme study</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ─────────────────────────────────────────────────────────────
     RECEIPT — monochrome evidence desk
     Geist discipline: black / white / gray ramp only.
     Color forbidden except status red when threat is high.
     Event stream is the product. Map is a narrow right peek.
     ───────────────────────────────────────────────────────────── */
  :root {
    --bg: #000000;
    --panel: #0a0a0a;
    --panel-2: #111111;
    --elev: #171717;
    --line: #262626;
    --line-2: #333333;
    --ink: #fafafa;
    --muted: #a3a3a3;
    --dim: #737373;
    --faint: #525252;
    --red: #ef4444; /* status only */
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", "Geist Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 var(--sans);
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: 48px auto 1fr;
    height: 100vh;
  }

  /* header */
  .top {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand {
    font: 600 13px var(--sans);
    letter-spacing: -0.01em;
    display: flex; align-items: baseline; gap: 8px;
  }
  .brand em {
    font-style: normal;
    font-weight: 400;
    color: var(--dim);
    font-size: 12px;
  }
  .threat {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 11px var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 4px 10px;
  }
  .threat strong {
    color: var(--red);
    font-weight: 600;
  }
  .top-meta {
    margin-left: auto;
    display: flex; align-items: center; gap: 12px;
    font: 400 12px var(--mono);
    color: var(--dim);
  }
  .top-meta a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--line-2);
  }
  .top-meta a:hover { color: var(--ink); }

  /* filter bar */
  .filters {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .filters .lbl {
    font: 500 11px var(--mono);
    color: var(--faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 6px;
  }
  .filters button {
    font: 500 11px var(--mono);
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--line);
    padding: 4px 10px;
    cursor: pointer;
  }
  .filters button.on,
  .filters button:hover {
    color: var(--ink);
    border-color: var(--ink);
    background: var(--elev);
  }
  .filters .stats {
    margin-left: auto;
    display: flex; gap: 14px;
    font: 400 11px var(--mono);
    color: var(--dim);
  }
  .filters .stats b {
    color: var(--ink);
    font-weight: 500;
  }

  /* main feed */
  .feed {
    min-width: 0;
    overflow: auto;
    background: var(--bg);
    border-right: 1px solid var(--line);
  }
  .feed-head {
    position: sticky; top: 0; z-index: 2;
    display: grid;
    grid-template-columns: 88px 148px 110px 90px 1fr;
    gap: 0;
    padding: 0 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    font: 500 10px var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .feed-head span { padding: 8px 8px 8px 0; }

  .line {
    display: grid;
    grid-template-columns: 88px 148px 110px 90px 1fr;
    gap: 0;
    padding: 0 16px;
    border-bottom: 1px solid #141414;
    font: 12.5px var(--mono);
    cursor: pointer;
    align-items: start;
  }
  .line:hover { background: var(--panel); }
  .line.sel { background: var(--elev); }
  .line > span {
    padding: 10px 8px 10px 0;
    min-width: 0;
  }
  .line .t { color: var(--dim); }
  .line .ip { color: var(--ink); }
  .line .user { color: var(--muted); }
  .line .kind {
    color: var(--dim);
    text-transform: lowercase;
  }
  .line .kind.failed_password,
  .line .kind.invalid_user { color: var(--red); }
  .line .kind.accepted,
  .line .kind.command { color: var(--ink); }
  .line .body {
    color: var(--muted);
    word-break: break-all;
  }
  .line .body .cmd {
    color: var(--ink);
  }

  /* empty / footer tally */
  .tally {
    padding: 12px 16px 24px;
    font: 400 11px var(--mono);
    color: var(--faint);
    border-top: 1px dashed var(--line);
    margin-top: 8px;
  }

  /* right peek: map + detail */
  .peek {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 0;
    background: var(--panel);
    overflow: hidden;
  }
  .peek-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    font: 500 11px var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
    display: flex; justify-content: space-between;
  }
  .peek-head b { color: var(--muted); font-weight: 500; }

  #globe-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    max-height: 280px;
    background: #050505;
    border-bottom: 1px solid var(--line);
  }
  #cobe { width: 100%; height: 100%; display: block; cursor: grab; }

  .focus {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  .focus button {
    font: 500 10px var(--mono);
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--line);
    padding: 3px 7px;
    cursor: pointer;
  }
  .focus button.on,
  .focus button:hover {
    color: var(--ink);
    border-color: var(--ink);
  }

  .actors {
    overflow: auto;
    padding: 4px 0 8px;
    min-height: 0;
  }
  .actor {
    padding: 10px 14px;
    border-bottom: 1px solid #141414;
    cursor: default;
  }
  .actor .ip {
    font: 500 12px var(--mono);
    color: var(--ink);
  }
  .actor .meta {
    margin-top: 3px;
    font: 400 11px var(--mono);
    color: var(--dim);
  }
  .actor .meta em {
    font-style: normal;
    color: var(--muted);
  }

  .peek-foot {
    border-top: 1px solid var(--line);
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .peek-foot .box {
    border: 1px solid var(--line);
    padding: 10px;
  }
  .peek-foot .n {
    font: 600 16px/1 var(--mono);
    letter-spacing: -0.02em;
  }
  .peek-foot .l {
    margin-top: 4px;
    font: 400 10px var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .detail {
    display: none;
    border-top: 1px solid var(--line);
    padding: 12px 14px;
    font: 12px var(--mono);
  }
  .detail.on { display: block; }
  .detail .k {
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .detail .v {
    color: var(--ink);
    margin-bottom: 10px;
    word-break: break-all;
  }

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 48px auto 1fr auto; }
    .feed { border-right: 0; }
    .peek {
      border-top: 1px solid var(--line);
      max-height: 40vh;
      grid-template-rows: auto minmax(140px, 40%) 1fr;
    }
    #globe-wrap { max-height: 160px; }
    .feed-head, .line {
      grid-template-columns: 72px 1fr;
    }
    .feed-head span:nth-child(n+3),
    .line > span:nth-child(n+3):not(.body) { display: none; }
    .line .body { grid-column: 1 / -1; padding-top: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">ShardLure <em>Receipt</em></div>
    <div class="threat">Threat <strong>52 HIGH</strong></div>
    <div class="top-meta">
      <span>origin Mumbai</span>
      <span id="clock">—</span>
      <a href="./index.html">studies</a>
    </div>
  </header>

  <div class="filters">
    <span class="lbl">Kind</span>
    <button type="button" class="on" data-k="all">all</button>
    <button type="button" data-k="failed_password">failed_password</button>
    <button type="button" data-k="connect">connect</button>
    <button type="button" data-k="accepted">accepted</button>
    <button type="button" data-k="command">command</button>
    <div class="stats" id="stats"></div>
  </div>

  <section class="feed" id="feed-wrap">
    <div class="feed-head">
      <span>Time</span>
      <span>Source</span>
      <span>User</span>
      <span>Kind</span>
      <span>Receipt</span>
    </div>
    <div id="feed"></div>
    <div class="tally" id="tally">—</div>
  </section>

  <aside class="peek">
    <div class="peek-head">
      <span>Field</span>
      <b>φ <span id="phi">—</span></b>
    </div>
    <div>
      <div id="globe-wrap">
        <canvas id="cobe" width="600" height="600"></canvas>
      </div>
      <div class="focus" id="focuses"></div>
      <div class="detail" id="detail">
        <div class="k">Selected</div>
        <div class="v" id="d-main">—</div>
        <div class="k">Context</div>
        <div class="v" id="d-ctx">—</div>
      </div>
    </div>
    <div class="actors" id="actors"></div>
    <div class="peek-foot" id="cap"></div>
  </aside>
</div>

<script type="importmap">
{
  "imports": { "cobe": "https://esm.sh/cobe@2.0.0" }
}
</script>
<script type="module">
import createGlobe from "cobe";
import {
  SUMMARY, ACTORS, CAPTURE, FEED, PLACES,
  fmt, tickClock, globeEntities,
  bindGlobeInteraction, startGlobeLoop, wireFocusButtons,
} from "./_shared.js";

tickClock(document.getElementById("clock"));

document.getElementById("stats").innerHTML = `
  <span><b>${fmt(SUMMARY.events)}</b> events</span>
  <span><b>${fmt(SUMMARY.actors)}</b> actors</span>
  <span><b>${fmt(SUMMARY.ips)}</b> ips</span>`;

// Expand FEED into a denser receipt log by folding actors + synthetic cadence
const base = FEED.map(([t, ip, u, k, cmd]) => ({ t, ip, u: u || "—", k, cmd: cmd || "" }));
const extra = ACTORS.flatMap((a, i) => [
  {
    t: `12:${String(30 - i).padStart(2, "0")}:${String(10 + i * 3).padStart(2, "0")}`,
    ip: a.ip,
    u: i % 2 ? "root" : "admin",
    k: i % 3 === 0 ? "command" : "failed_password",
    cmd: i % 3 === 0 ? "uname -a" : "",
  },
  {
    t: `12:${String(28 - i).padStart(2, "0")}:${String(40 + i).padStart(2, "0")}`,
    ip: a.ip,
    u: "—",
    k: "connect",
    cmd: "",
  },
]);
const allLines = [...base, ...extra].sort((a, b) => (a.t < b.t ? 1 : -1));

const feedEl = document.getElementById("feed");
const detail = document.getElementById("detail");
let activeKind = "all";

function paint(list) {
  feedEl.innerHTML = list.map((r, i) => `
    <div class="line" data-i="${i}" role="button" tabindex="0">
      <span class="t">${r.t}</span>
      <span class="ip">${r.ip}</span>
      <span class="user">${r.u}</span>
      <span class="kind ${r.k}">${r.k}</span>
      <span class="body">${r.cmd ? `<span class="cmd">${r.cmd}</span>` : "—"}</span>
    </div>`).join("");
  document.getElementById("tally").textContent =
    `${list.length} receipts shown · stream is mock desk copy · cluster by playbook not IP`;
}
paint(allLines);

function filtered() {
  return activeKind === "all" ? allLines : allLines.filter((r) => r.k === activeKind);
}

document.querySelectorAll(".filters button[data-k]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filters button[data-k]").forEach((b) => b.classList.remove("on"));
    btn.classList.add("on");
    activeKind = btn.dataset.k;
    paint(filtered());
  });
});

feedEl.addEventListener("click", (e) => {
  const line = e.target.closest(".line");
  if (!line) return;
  feedEl.querySelectorAll(".line").forEach((l) => l.classList.remove("sel"));
  line.classList.add("sel");
  const list = filtered();
  const r = list[+line.dataset.i];
  if (!r) return;
  detail.classList.add("on");
  document.getElementById("d-main").textContent = `${r.t}  ${r.ip}  ${r.u}  ${r.k}`;
  document.getElementById("d-ctx").textContent = r.cmd
    ? r.cmd
    : "No command body · auth / session chassis only";
});

document.getElementById("actors").innerHTML = ACTORS.map((a) => `
  <div class="actor">
    <div class="ip">${a.ip}</div>
    <div class="meta">${a.cc} · <em>${a.playbook}</em> · ${fmt(a.events)}</div>
  </div>`).join("");

document.getElementById("cap").innerHTML = `
  <div class="box"><div class="n">${CAPTURE.saved}</div><div class="l">Saved</div></div>
  <div class="box"><div class="n">${CAPTURE.bytes}</div><div class="l">Held</div></div>
  <div class="box"><div class="n">${CAPTURE.fetching}</div><div class="l">Fetch</div></div>
  <div class="box"><div class="n">${CAPTURE.failed}</div><div class="l">Fail</div></div>`;

const canvas = document.getElementById("cobe");
const wrap = document.getElementById("globe-wrap");
const state = {
  phi: 2.4, theta: 0.22,
  targetPhi: 2.4, targetTheta: 0.22,
  scale: 1, targetScale: 1, autoRotate: true,
};
// Monochrome globe — bone/ink only
const { markers, arcs } = globeEntities({
  home: [0.95, 0.95, 0.95],
  hot: [0.85, 0.85, 0.85],
  cool: [0.45, 0.45, 0.45],
  arc: [0.70, 0.70, 0.70],
});
const size = () => Math.min(wrap.clientWidth, wrap.clientHeight) * 2;
const ix = bindGlobeInteraction(canvas, state, { wrap, places: PLACES });
wireFocusButtons(document.getElementById("focuses"), ix);
const globe = createGlobe(canvas, {
  devicePixelRatio: 2,
  width: size(), height: size(),
  phi: state.phi, theta: state.theta,
  dark: 1, diffuse: 1.0,
  mapSamples: 14000,
  mapBrightness: 2.2,
  mapBaseBrightness: 0.02,
  baseColor: [0.04, 0.04, 0.04],
  markerColor: [0.9, 0.9, 0.9],
  glowColor: [0.08, 0.08, 0.08],
  markerElevation: 0.01,
  arcColor: [0.65, 0.65, 0.65],
  arcWidth: 0.4, arcHeight: 0.24,
  markers, arcs,
});
startGlobeLoop(globe, ix, (view) => {
  document.getElementById("phi").textContent = view.phi.toFixed(2);
});
addEventListener("resize", () => {
  const s = size();
  globe.update({ width: s, height: s });
});
</script>
</body>
</html>
