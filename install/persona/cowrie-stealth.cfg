[honeypot]
# Always log UTC regardless of host timezone — cowrie only emits the
# 'Z'-suffixed jsonlog timestamps ShardLure expects when TZ is UTC.
timezone = UTC
hostname = prod-app-server-01
sensor_name = prod-app-server-01
txtcmds_path = share/cowrie/txtcmds
# Cap every wget/curl/tftp/scp/sftp transfer at ShardLure's capture.max_bytes
# (50 MiB). Cowrie reads this key only from [honeypot]; it previously sat
# under [output_jsonlog], where it was ignored and downloads were unbounded.
download_limit_size = 52428800
# The persona's uptime at Cowrie start: 42d 3h17m. Cowrie v3.1.1 derives
# boot_time() = start - boot_offset, which drives /proc/uptime, uptime, w and
# last; unset, it draws a random 1-90 days per process, so the profiler's
# UPTIME disagreed with the persona's own motd/last. gen-time-persona.py reads
# this value (one source of truth; test_shardlure pins every copy).
boot_offset = 3640620

[shell]
arch = linux-x64-lsb
kernel_name = Linux
kernel_version = 5.15.0-94-generic
kernel_build_string = #104-Ubuntu SMP Tue Jan 9 15:25:40 UTC 2024
hardware_platform = x86_64
operating_system = GNU/Linux
ssh_version = OpenSSH_8.9p1 Ubuntu-3ubuntu0.6, OpenSSL 3.0.2 15 Mar 2022

[ssh]
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

[output_jsonlog]
enabled = true
epoch_timestamp = false
