name: CI

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: Go test (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check UTF-8 text
        run: bash scripts/check-utf8.sh

      - name: Test release contracts
        run: python3 -m unittest scripts/test_release_contracts.py -v

      - name: Test Cowrie pin and checkout contracts
        run: python3 -m unittest scripts/test_shardlure.py -v

      - name: Test Cowrie patch compatibility
        run: bash scripts/check-cowrie-patches.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt:\n'
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Build (native amd64)
        run: go build -o shardlure ./cmd/shardlure

      - name: Smoke - version
        run: ./shardlure version

      - name: Smoke - web server boots and serves dashboard
        run: bash scripts/ci-web-smoke.sh

  cross-build:
    name: Cross-build ${{ matrix.target.label }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target:
          - { label: "linux-amd64", goos: linux, goarch: amd64, goarm: "", qemu: amd64 }
          - { label: "linux-arm64", goos: linux, goarch: arm64, goarm: "", qemu: arm64 }
          - { label: "linux-armv7", goos: linux, goarch: arm, goarm: "7", qemu: arm }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
        run: |
          # Stamp version (from the tag, or short SHA on untagged builds) and
          # commit so `shardlure version` / the dashboard report the real build
          # instead of dev/unknown.
          VERSION="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VERSION="$(git rev-parse --short HEAD)" ;; esac
          COMMIT="$(git rev-parse --short HEAD)"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o dist/shardlure-${{ matrix.target.label }} \
            ./cmd/shardlure
          file dist/shardlure-${{ matrix.target.label }}
          ls -lh dist/shardlure-${{ matrix.target.label }}

      - name: Register binfmt (QEMU user-mode for foreign arch)
        if: matrix.target.qemu != 'amd64'
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Smoke - run version under QEMU (foreign arch)
        if: matrix.target.qemu != 'amd64'
        run: |
          # Use a minimal arch-matched base image so the dynamic loader path matches.
          # The binary is statically linked (CGO_ENABLED=0) so any image works.
          docker run --rm --platform linux/${{ matrix.target.qemu }} \
            -v "$PWD/dist:/dist:ro" \
            alpine:3.20 /dist/shardlure-${{ matrix.target.label }} version

      - name: Smoke - run version (native amd64)
        if: matrix.target.qemu == 'amd64'
        run: ./dist/shardlure-${{ matrix.target.label }} version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shardlure-${{ matrix.target.label }}
          path: dist/shardlure-${{ matrix.target.label }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach binaries to release
    runs-on: ubuntu-latest
    needs: cross-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # actions/checkout force-updates the TRIGGERING tag ref to the resolved
      # COMMIT sha ("t [tag update] <sha> -> vX" in its log), so inside CI
      # `git cat-file -t refs/tags/vX` reports "commit" while every other tag is
      # a proper "tag" object. fetch-tags: true does NOT prevent this — checkout
      # clobbers the ref after fetching it. publish-release.sh deliberately
      # requires a real annotated tag object, so re-fetch that one ref to restore
      # it, before the expensive artifact download. Verified from the v2.0.0 CI
      # diagnostics: without this the guard aborts with "must be an annotated
      # tag" on a tag that IS annotated on the remote.
      - name: Restore annotated tag object
        run: |
          git fetch --force origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          find artifacts -type f -name 'shardlure-linux-*' -exec cp {} release/ \;
          # Generate SHA256 checksums so install.sh can verify integrity.
          (cd release && sha256sum shardlure-linux-* > SHA256SUMS)
          ls -lh release/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh
